services:
  blog-app:
    build:
      context: .
    image: linjinmu-blog:${BLOG_IMAGE_TAG:-local}
    container_name: linjinmu-blog-app
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /app
    env_file:
      - path: ../secrets/.env
        format: raw
    environment:
      NODE_ENV: production
      ASTRO_TELEMETRY_DISABLED: "1"
      BLOG_ROOT: /app
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: "4322"
      ADMIN_AUTH_DISABLED: "false"
      CONTENT_GIT_SSH_KEY_PATH: /home/node/.ssh/linjinmu_blog_github
      CONTENT_GIT_WORKTREE: /app/server/data/content-repository
      BLOG_BACKUP_DIR: /app/server/backups
    volumes:
      - ./:/app
      - blog_node_modules:/app/node_modules
      - ../secrets/linjinmu_blog_github:/home/node/.ssh/linjinmu_blog_github:ro
      - ../secrets/known_hosts:/home/node/.ssh/known_hosts:ro
    networks:
      npm-network:
        aliases:
          - linjinmu-blog
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(4322,'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  blog-web:
    image: nginx:1.27-alpine
    container_name: linjinmu-blog-web
    restart: unless-stopped
    depends_on:
      blog-app:
        condition: service_healthy
    network_mode: service:blog-app
    user: "101:101"
    read_only: true
    volumes:
      - ./:/app:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    image: linjinmu-blog:${BLOG_IMAGE_TAG:-local}
    profiles: ["maintenance"]
    network_mode: none
    user: "1000:1000"
    working_dir: /app
    env_file:
      - path: ../secrets/.env
        format: raw
    environment:
      BLOG_ROOT: /app
      BLOG_BACKUP_DIR: /app/server/backups
    volumes:
      - ./:/app
      - blog_node_modules:/app/node_modules
    command: ["npm", "run", "backup"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  blog_node_modules:

networks:
  npm-network:
    external: true
